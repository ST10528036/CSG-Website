<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enquiry | Club Sport Goodwill</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Website header -->
    <header>

        <div class="logo">
            <a href="index.html">CSG</a>
        </div>

        <!-- Navigation menu -->
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="donate.html">Donate</a></li>
            </ul>
        </nav>

    </header>


    <main>

        <section class="page-header">

            <h1>Make an Enquiry</h1>

            <p>
                Interested in CSG? Send us your enquiry below.
            </p>

        </section>


        <!-- Enquiry form -->
        <section class="form-section">

            <form action="#" method="post">

                <!-- Name -->
                <div class="form-group">
                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>


                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        required
                    >
                </div>


                <!-- Enquiry type -->
                <div class="form-group">

                    <label for="enquiry-type">
                        Enquiry Type
                    </label>

                    <select id="enquiry-type" name="enquiry-type">

                        <option value="">
                            Select an option
                        </option>

                        <option value="event">
                            Event Information
                        </option>

                        <option value="owner">
                            Showcase My Supercar
                        </option>

                        <option value="sponsor">
                            Sponsorship
                        </option>

                        <option value="donation">
                            Donation
                        </option>

                        <option value="general">
                            General Enquiry
                        </option>

                    </select>

                </div>


                <!-- Message -->
                <div class="form-group">

                    <label for="message">Message</label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        placeholder="Enter your enquiry"
                        required
                    ></textarea>

                </div>


                <!-- Submit button -->
                <button type="submit">
                    Submit Enquiry
                </button>

            </form>

        </section>

    </main>


    <footer>
        <p>&copy; 2026 Club Sport Goodwill. All rights reserved.</p>
    </footer>

</body>
</html>
